<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: transparent !important;
    background-color: transparent !important;

    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    color: #eaf7ff;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* =========================
     MAIN PLAYER
     ========================= */

  #player {
    position: relative;
    isolation: isolate;

    width: 100%;
    height: 100%;

    padding: clamp(8px, 3%, 16px);

    border-radius: 18px;

    /* VERY TRANSPARENT GLASS */
    background: rgba(255, 255, 255, 0.035);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    /* Blue border */
    border: 1px solid rgba(120, 215, 255, 0.65);

    overflow: hidden;

    /* Soft permanent glow */
    box-shadow:
      0 0 6px rgba(90, 200, 255, 0.55),
      0 0 18px rgba(50, 170, 255, 0.3),
      inset 0 0 15px rgba(100, 210, 255, 0.05);

    transition:
      transform 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease;
  }


  /* =========================
     MOVING BORDER GLOW
     ========================= */

  #player::before {
    content: "";

    position: absolute;

    width: 180%;
    height: 180%;

    left: -40%;
    top: -40%;

    z-index: -1;

    background: conic-gradient(
      from 0deg,

      transparent 0deg,
      transparent 315deg,

      rgba(70, 190, 255, 0.05) 325deg,
      rgba(90, 205, 255, 0.35) 338deg,
      rgba(170, 240, 255, 1) 347deg,
      rgba(70, 190, 255, 0.25) 355deg,

      transparent 360deg
    );

    filter: blur(5px);

    animation: spinGlow 2.5s linear infinite;
  }


  /* Sharp moving light */

  #player::after {
    content: "";

    position: absolute;

    width: 180%;
    height: 180%;

    left: -40%;
    top: -40%;

    z-index: -1;

    background: conic-gradient(
      from 0deg,

      transparent 0deg,
      transparent 335deg,

      rgba(130, 225, 255, 0.2) 340deg,
      rgba(200, 245, 255, 1) 348deg,
      rgba(80, 190, 255, 0.15) 354deg,

      transparent 360deg
    );

    filter: blur(1px);

    animation: spinGlow 2.5s linear infinite;
  }


  @keyframes spinGlow {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }


  /* =========================
     HOVER EFFECT
     ========================= */

  #player:hover {
    transform: scale(1.015);

    border-color: rgba(185, 240, 255, 0.95);

    box-shadow:
      0 0 8px rgba(140, 230, 255, 0.95),
      0 0 20px rgba(90, 205, 255, 0.7),
      0 0 40px rgba(50, 170, 255, 0.4),
      inset 0 0 20px rgba(120, 220, 255, 0.08);
  }


  /* =========================
     TITLE
     ========================= */

  #title {
    position: relative;
    z-index: 5;

    font-size: clamp(11px, 5vw, 15px);

    font-weight: 600;

    margin-bottom: 8px;

    color: #eaf7ff;

    text-shadow:
      0 0 6px rgba(120, 220, 255, 0.8),
      0 0 14px rgba(60, 180, 255, 0.35);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
  }


  /* =========================
     CONTROLS
     ========================= */

  #controls {
    position: relative;
    z-index: 5;

    display: flex;

    align-items: center;

    gap: 8px;
  }


  /* =========================
     PLAY BUTTON
     ========================= */

  button {
    width: 32px;
    height: 30px;

    padding: 0;

    background: rgba(255, 255, 255, 0.025);

    border: 1px solid rgba(120, 220, 255, 0.6);

    border-radius: 8px;

    color: #eaf9ff;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
      0 0 6px rgba(70, 190, 255, 0.35);

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.15s ease;
  }


  button:hover {
    background: rgba(100, 210, 255, 0.08);

    border-color: rgba(190, 240, 255, 1);

    box-shadow:
      0 0 10px rgba(110, 220, 255, 0.9),
      0 0 20px rgba(50, 170, 255, 0.45);

    transform: translateY(-1px);
  }


  button:active {
    transform: scale(0.92);
  }


  /* =========================
     VOLUME
     ========================= */

  #volWrap {
    display: flex;

    align-items: center;

    gap: 5px;

    color: #bdeaff;

    font-size: 12px;

    text-shadow:
      0 0 6px rgba(80, 200, 255, 0.7);
  }


  #volume {
    width: 70px;

    height: 4px;

    accent-color: #61cfff;

    cursor: pointer;

    filter:
      drop-shadow(0 0 4px rgba(80, 200, 255, 0.7));
  }


  /* =========================
     PROGRESS
     ========================= */

  #progress {
    position: relative;

    z-index: 5;

    display: block;

    width: 100%;

    height: 5px;

    margin-top: 10px;

    accent-color: #61cfff;

    cursor: pointer;

    filter:
      drop-shadow(0 0 4px rgba(80, 200, 255, 0.7));
  }


  /* =========================
     STATUS
     ========================= */

  #status {
    position: relative;

    z-index: 5;

    color: rgba(205, 235, 250, 0.7);

    font-size: 9px;

    margin-top: 4px;
  }
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

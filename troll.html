<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>

<style>
  body {
    margin: 0;
    width: 240px;
    height: 110px;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    font-family: system-ui, sans-serif;
    color: #eaffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #player {
    width: 225px;
    padding: 8px;
    border-radius: 10px;
    background: rgba(0,0,0,0.6);
    box-shadow:
      0 0 10px #00ffcc,
      0 0 20px rgba(0,255,204,0.4),
      inset 0 0 10px rgba(0,255,204,0.15);
  }

  #title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow:
      0 0 5px #00ffcc,
      0 0 10px #00ffcc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  button {
    background: black;
    border: 1px solid #00ffcc;
    color: #00ffcc;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 6px #00ffcc;
  }

  button:hover {
    background: #00ffcc;
    color: black;
  }

  #volWrap {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #c77dff;
    text-shadow: 0 0 6px #c77dff;
  }

  #volume {
    width: 70px;
    accent-color: #c77dff;
  }

  #progress {
    width: 100%;
    margin-top: 6px;
    accent-color: #00ffcc;
  }

  #status {
    font-size: 9px;
    margin-top: 3px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
    src="https://cdn.jsdelivr.net/gh/mrari857/Music@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
    type="audio/mpeg"
  >
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

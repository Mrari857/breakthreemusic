<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eaf7ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #player {
    position: relative;
    isolation: isolate;

    width: 100%;
    height: 100%;
    padding: clamp(8px, 3%, 16px);

    border-radius: 18px;

    background: rgba(7, 17, 30, 0.32);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid rgba(130, 220, 255, 0.75);

    box-shadow:
      0 0 10px rgba(70, 190, 255, 0.8),
      0 0 25px rgba(50, 170, 255, 0.55),
      inset 0 0 20px rgba(80, 200, 255, 0.08);

    overflow: hidden;

    transition:
      transform 0.3s ease,
      background 0.3s ease;
  }

  /*
    Moving glow layer
  */
  #player::before {
    content: "";

    position: absolute;
    z-index: -1;

    width: 180%;
    height: 180%;

    left: -40%;
    top: -40%;

    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 55deg,
      rgba(80, 200, 255, 0.15) 80deg,
      rgba(100, 220, 255, 0.95) 110deg,
      rgba(40, 160, 255, 0.2) 140deg,
      transparent 175deg,
      transparent 360deg
    );

    filter: blur(12px);

    animation: movingGlow 3s linear infinite;
  }

  /*
    Soft blue glow behind the player
  */
  #player::after {
    content: "";

    position: absolute;
    z-index: -2;

    inset: -25px;

    border-radius: 35px;

    background: rgba(40, 170, 255, 0.35);

    filter: blur(25px);

    animation: outerGlow 2.5s ease-in-out infinite alternate;
  }

  @keyframes movingGlow {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  @keyframes outerGlow {
    from {
      opacity: 0.45;
      transform: scale(0.95);
    }

    to {
      opacity: 0.95;
      transform: scale(1.05);
    }
  }

  /*
    Hover = MUCH stronger glow
  */
  #player:hover {
    transform: scale(1.015);

    background: rgba(8, 22, 38, 0.4);

    border-color: rgba(180, 235, 255, 1);

    box-shadow:
      0 0 8px rgba(150, 230, 255, 1),
      0 0 20px rgba(100, 215, 255, 1),
      0 0 40px rgba(60, 190, 255, 0.9),
      0 0 75px rgba(30, 150, 255, 0.7),
      inset 0 0 25px rgba(100, 220, 255, 0.15);
  }

  #player:hover::after {
    opacity: 1;
    filter: blur(32px);
  }

  #title {
    position: relative;
    z-index: 2;

    font-size: clamp(11px, 5vw, 15px);
    font-weight: 600;

    margin-bottom: 8px;

    color: #eaf7ff;

    text-shadow:
      0 0 6px rgba(120, 220, 255, 0.7),
      0 0 15px rgba(60, 180, 255, 0.35);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #controls {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;
    gap: 8px;
  }

  button {
    width: 32px;
    height: 30px;

    padding: 0;

    background: rgba(15, 40, 60, 0.55);

    border: 1px solid rgba(120, 220, 255, 0.55);

    border-radius: 8px;

    color: #e5f8ff;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
      0 0 7px rgba(70, 190, 255, 0.35);

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.15s ease;
  }

  button:hover {
    background: rgba(45, 110, 150, 0.6);

    border-color: rgba(180, 235, 255, 1);

    box-shadow:
      0 0 10px rgba(100, 215, 255, 0.9),
      0 0 20px rgba(50, 170, 255, 0.45);

    transform: translateY(-1px);
  }

  button:active {
    transform: scale(0.92);
  }

  #volWrap {
    display: flex;
    align-items: center;
    gap: 5px;

    color: #c5ecff;

    font-size: 12px;

    text-shadow:
      0 0 7px rgba(80, 200, 255, 0.6);
  }

  #volume {
    width: 70px;
    height: 4px;

    accent-color: #61cfff;

    cursor: pointer;

    filter:
      drop-shadow(0 0 3px rgba(80, 200, 255, 0.7));
  }

  #progress {
    position: relative;
    z-index: 2;

    display: block;

    width: 100%;
    height: 5px;

    margin-top: 10px;

    accent-color: #61cfff;

    cursor: pointer;

    filter:
      drop-shadow(0 0 3px rgba(80, 200, 255, 0.7));
  }

  #status {
    position: relative;
    z-index: 2;

    color: rgba(205, 235, 250, 0.7);

    font-size: 9px;

    margin-top: 4px;
  }
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

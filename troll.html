<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eaf7ff;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* =========================
     PLAYER
     ========================= */

  #player {
    position: relative;
    isolation: isolate;

    width: 100%;
    height: 100%;

    padding: clamp(8px, 3%, 16px);

    border-radius: 18px;

    /* COMPLETELY TRANSPARENT */
    background: transparent !important;

    border: 1px solid rgba(120, 215, 255, 0.35);

    overflow: hidden;

    /* Very subtle permanent border glow */
    box-shadow:
      0 0 5px rgba(80, 190, 255, 0.35);

    transition: transform 0.25s ease;
  }


  /* =========================
     MOVING BORDER GLOW
     ========================= */

  #player::before {
    content: "";

    position: absolute;

    inset: -50%;

    z-index: -1;

    /*
      Bright section of the border.
      It rotates around the entire player.
    */
    background: conic-gradient(
      from 0deg,

      transparent 0deg,
      transparent 315deg,

      rgba(80, 200, 255, 0.05) 325deg,
      rgba(100, 220, 255, 0.25) 335deg,
      rgba(150, 235, 255, 1) 345deg,
      rgba(80, 190, 255, 0.35) 355deg,

      transparent 360deg
    );

    animation: borderSpin 2.5s linear infinite;

    filter: blur(3px);
  }


  /*
    Second sharper layer
    makes the moving light more obvious
  */

  #player::after {
    content: "";

    position: absolute;

    inset: -50%;

    z-index: -1;

    background: conic-gradient(
      from 0deg,

      transparent 0deg,
      transparent 330deg,

      rgba(130, 225, 255, 0.1) 338deg,
      rgba(170, 240, 255, 1) 346deg,
      rgba(80, 190, 255, 0.2) 353deg,

      transparent 360deg
    );

    animation: borderSpin 2.5s linear infinite;

    filter: blur(1px);
  }


  @keyframes borderSpin {

    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }

  }


  /* =========================
     HOVER
     ========================= */

  #player:hover {
    transform: scale(1.015);

    border-color: rgba(170, 235, 255, 0.8);

    box-shadow:
      0 0 6px rgba(120, 220, 255, 0.7),
      0 0 15px rgba(70, 190, 255, 0.35);
  }


  /* =========================
     TITLE
     ========================= */

  #title {
    position: relative;
    z-index: 5;

    font-size: clamp(11px, 5vw, 15px);

    font-weight: 600;

    margin-bottom: 8px;

    color: #eaf7ff;

    text-shadow:
      0 0 6px rgba(100, 210, 255, 0.7);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
  }


  /* =========================
     CONTROLS
     ========================= */

  #controls {
    position: relative;
    z-index: 5;

    display: flex;

    align-items: center;

    gap: 8px;
  }


  /* =========================
     PLAY BUTTON
     ========================= */

  button {
    width: 32px;
    height: 30px;

    padding: 0;

    background: rgba(0, 0, 0, 0.15);

    border: 1px solid rgba(120, 215, 255, 0.55);

    border-radius: 8px;

    color: #e8f9ff;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
      0 0 5px rgba(70, 190, 255, 0.25);

    transition:
      0.2s ease;
  }


  button:hover {

    background: rgba(70, 190, 255, 0.12);

    border-color: rgba(170, 235, 255, 1);

    color: white;

    box-shadow:
      0 0 8px rgba(100, 215, 255, 0.8),
      0 0 18px rgba(50, 170, 255, 0.4);

    transform: translateY(-1px);
  }


  button:active {
    transform: scale(0.92);
  }


  /* =========================
     VOLUME
     ========================= */

  #volWrap {

    display: flex;

    align-items: center;

    gap: 5px;

    color: #bde9ff;

    font-size: 12px;

    text-shadow:
      0 0 6px rgba(80, 200, 255, 0.6);
  }


  #volume {

    width: 70px;

    height: 4px;

    accent-color: #61cfff;

    cursor: pointer;
  }


  /* =========================
     PROGRESS
     ========================= */

  #progress {

    position: relative;

    z-index: 5;

    display: block;

    width: 100%;

    height: 5px;

    margin-top: 10px;

    accent-color: #61cfff;

    cursor: pointer;
  }


  /* =========================
     STATUS
     ========================= */

  #status {

    position: relative;

    z-index: 5;

    color: rgba(205, 235, 250, 0.65);

    font-size: 9px;

    margin-top: 4px;
  }

</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

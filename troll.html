<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Player</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    color: #eaf7ff;
  }


  /* =================================
     PLAYER
     ================================= */

  #player {
    position: relative;
    isolation: isolate;

    width: 100%;
    height: 100%;

    padding: clamp(8px, 3%, 14px);

    border-radius: 16px;

    /*
      Dark blue-grey transparent glass
    */

    background: rgba(13, 24, 36, 0.72);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border: 1px solid rgba(120, 190, 225, 0.25);

    overflow: hidden;

    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.04),
      0 0 5px rgba(70, 170, 220, 0.15);

    transition:
      transform 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease;
  }


  /* =================================
     MOVING BORDER
     ================================= */

  #player::before {

    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 17px;

    padding: 1px;

    background: conic-gradient(
      from 0deg,

      transparent 0deg,
      transparent 255deg,

      rgba(50, 170, 230, 0.02) 285deg,

      rgba(70, 190, 245, 0.12) 315deg,

      rgba(130, 220, 255, 0.7) 342deg,

      rgba(190, 240, 255, 0.95) 350deg,

      rgba(80, 190, 240, 0.15) 357deg,

      transparent 360deg
    );

    /*
      Keep the middle transparent.
    */

    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);

    -webkit-mask-composite: xor;

    mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);

    mask-composite: exclude;

    filter:
      drop-shadow(
        0 0 3px rgba(80, 190, 255, 0.55)
      );

    animation:
      borderOrbit 4.5s linear infinite;

    pointer-events: none;
  }


  @keyframes borderOrbit {

    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }

  }


  /* =================================
     SUBTLE INNER EDGE
     ================================= */

  #player::after {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 16px;

    border: 1px solid
      rgba(120, 205, 240, 0.08);

    pointer-events: none;
  }


  /* =================================
     HOVER
     ================================= */

  #player:hover {

    transform: scale(1.012);

    border-color:
      rgba(140, 215, 245, 0.42);

    box-shadow:

      inset 0 1px 0
        rgba(255, 255, 255, 0.06),

      0 0 8px
        rgba(70, 180, 235, 0.2);
  }


  /* =================================
     TITLE
     ================================= */

  #title {

    position: relative;

    z-index: 5;

    margin-bottom: 8px;

    font-size: clamp(11px, 5vw, 14px);

    font-weight: 600;

    color: #e9f7ff;

    text-shadow:
      0 0 5px
        rgba(100, 200, 245, 0.35);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
  }


  /* =================================
     CONTROLS
     ================================= */

  #controls {

    position: relative;

    z-index: 5;

    display: flex;

    align-items: center;

    gap: 7px;
  }


  /* =================================
     PLAY BUTTON
     ================================= */

  button {

    width: 32px;
    height: 30px;

    padding: 0;

    background:
      rgba(20, 38, 52, 0.55);

    border:
      1px solid
      rgba(100, 190, 230, 0.3);

    border-radius: 7px;

    color: #dff5ff;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
      inset 0 1px 0
        rgba(255, 255, 255, 0.04),

      0 0 5px
        rgba(60, 170, 220, 0.12);

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.15s ease;
  }


  button:hover {

    background:
      rgba(35, 65, 85, 0.65);

    border-color:
      rgba(140, 220, 250, 0.6);

    box-shadow:
      0 0 7px
        rgba(70, 190, 240, 0.3);

    transform:
      translateY(-1px);
  }


  button:active {
    transform: scale(0.93);
  }


  /* =================================
     VOLUME
     ================================= */

  #volWrap {

    display: flex;

    align-items: center;

    gap: 5px;

    color: #b9dff0;

    font-size: 12px;
  }


  #volume {

    width: 70px;

    height: 4px;

    accent-color: #5dbce8;

    cursor: pointer;
  }


  /* =================================
     PROGRESS
     ================================= */

  #progress {

    position: relative;

    z-index: 5;

    display: block;

    width: 100%;

    height: 5px;

    margin-top: 10px;

    accent-color: #5dbce8;

    cursor: pointer;
  }


  /* =================================
     STATUS
     ================================= */

  #status {

    position: relative;

    z-index: 5;

    margin-top: 4px;

    color:
      rgba(190, 220, 235, 0.6);

    font-size: 9px;
  }

</style>
</head>


<body>

<div id="player">

  <div id="title">
    Dominic Fike - Baby Doll
  </div>

  <div id="controls">

    <button id="playPause">
      ▶
    </button>

    <div id="volWrap">

      🔊

      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >

    </div>

  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    step="1"
  >

</div>


<audio
  id="audio"
  preload="metadata"
>
  <source
    src="https://raw.githubusercontent.com/Mrari857/breakthreemusic/main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
    type="audio/mpeg"
  >
</audio>


<script>

  const audio =
    document.getElementById("audio");

  const playPause =
    document.getElementById("playPause");

  const progress =
    document.getElementById("progress");

  const volume =
    document.getElementById("volume");


  audio.volume =
    Number(volume.value);


  /* PLAY / PAUSE */

  playPause.addEventListener(
    "click",
    async () => {

      try {

        if (audio.paused) {

          await audio.play();

          playPause.textContent = "⏸";

        } else {

          audio.pause();

          playPause.textContent = "▶";
        }

      } catch (error) {

        console.error(
          "Audio playback failed:",
          error
        );

        playPause.textContent = "▶";
      }

    }
  );


  /* VOLUME */

  volume.addEventListener(
    "input",
    () => {

      audio.volume =
        Number(volume.value);

    }
  );


  /* LOAD DURATION */

  audio.addEventListener(
    "loadedmetadata",
    () => {

      if (
        Number.isFinite(
          audio.duration
        )
      ) {

        progress.max =
          Math.floor(
            audio.duration
          );

      }

    }
  );


  /* PROGRESS */

  audio.addEventListener(
    "timeupdate",
    () => {

      if (
        Number.isFinite(
          audio.currentTime
        )
      ) {

        progress.value =
          Math.floor(
            audio.currentTime
          );

      }

    }
  );


  /* SEEK */

  progress.addEventListener(
    "input",
    () => {

      if (
        Number.isFinite(
          audio.duration
        )
      ) {

        audio.currentTime =
          Number(progress.value);

      }

    }
  );


  /* RESET BUTTON */

  audio.addEventListener(
    "ended",
    () => {

      playPause.textContent = "▶";

    }
  );

</script>

</body>
</html>

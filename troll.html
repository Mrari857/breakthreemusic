<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: transparent !important;
  background-color: transparent !important;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PLAYER */
#player {
  position: relative;

  width: 100%;
  height: 100%;

  padding: 10px;

  background: transparent !important;
  background-color: transparent !important;

  border: 1px solid rgba(120, 220, 255, 0.8);
  border-radius: 18px;

  overflow: hidden;

  /* ONLY BORDER GLOW */
  box-shadow:
    0 0 5px rgba(100, 210, 255, 0.9),
    0 0 15px rgba(70, 190, 255, 0.6),
    0 0 30px rgba(50, 160, 255, 0.35);
}

/* MOVING LIGHT AROUND BORDER */
#player::before {
  content: "";

  position: absolute;
  inset: -2px;

  border-radius: 20px;

  padding: 2px;

  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 300deg,
    #35bfff 325deg,
    #c8f5ff 345deg,
    #35bfff 355deg,
    transparent 360deg
  );

  /*
    Cut out the middle so ONLY the border remains
  */
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

  -webkit-mask-composite: xor;

  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

  mask-composite: exclude;

  animation: rotateGlow 2s linear infinite;

  pointer-events: none;
}

/* BIG SOFT GLOW */
#player::after {
  content: "";

  position: absolute;
  inset: -8px;

  border-radius: 25px;

  border: 3px solid rgba(60, 190, 255, 0.35);

  filter: blur(8px);

  animation: pulseGlow 1.8s ease-in-out infinite alternate;

  pointer-events: none;
}

@keyframes rotateGlow {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

@keyframes pulseGlow {
  from {
    opacity: 0.35;
  }

  to {
    opacity: 1;
  }
}

/* TITLE */
#title {
  position: relative;
  z-index: 5;

  color: white;

  font-size: 14px;
  font-weight: 600;

  margin-bottom: 8px;

  text-shadow:
    0 0 6px #55cfff,
    0 0 12px rgba(50, 180, 255, 0.6);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* CONTROLS */
#controls {
  position: relative;
  z-index: 5;

  display: flex;
  align-items: center;
  gap: 8px;
}

/* BUTTON */
button {
  width: 32px;
  height: 30px;

  padding: 0;

  background: transparent !important;

  border: 1px solid rgba(120, 220, 255, 0.7);

  border-radius: 8px;

  color: white;

  cursor: pointer;

  box-shadow:
    0 0 6px rgba(70, 190, 255, 0.7);

  transition: 0.2s ease;
}

button:hover {
  border-color: #c8f5ff;

  box-shadow:
    0 0 8px #70dfff,
    0 0 18px rgba(50, 180, 255, 0.8);

  transform: scale(1.05);
}

button:active {
  transform: scale(0.92);
}

/* VOLUME */
#volWrap {
  display: flex;
  align-items: center;
  gap: 5px;

  color: white;

  text-shadow:
    0 0 6px #55cfff;
}

#volume {
  width: 70px;
  height: 4px;

  accent-color: #55cfff;

  filter:
    drop-shadow(0 0 4px #55cfff);
}

/* PROGRESS */
#progress {
  position: relative;
  z-index: 5;

  width: 100%;
  height: 5px;

  margin-top: 10px;

  accent-color: #55cfff;

  filter:
    drop-shadow(0 0 4px #55cfff);
}
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

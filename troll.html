<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eaf7ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #player {
    position: relative;
    width: 100%;
    height: 100%;
    padding: clamp(8px, 3%, 16px);
    border-radius: 10px;

    background: rgba(8, 18, 30, 0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border: 1px solid rgba(100, 200, 255, 0.35);

    box-shadow:
      0 0 8px rgba(70, 180, 255, 0.25),
      0 0 18px rgba(50, 160, 255, 0.18),
      inset 0 0 15px rgba(80, 190, 255, 0.06);

    transition:
      transform 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease,
      background 0.25s ease;
  }

  /* Mouse hover animation */
  #player:hover {
    transform: scale(1.015);

    background: rgba(10, 25, 42, 0.55);

    border-color: rgba(130, 215, 255, 0.85);

    box-shadow:
      0 0 10px rgba(70, 190, 255, 0.55),
      0 0 25px rgba(50, 170, 255, 0.4),
      0 0 45px rgba(30, 130, 255, 0.18),
      inset 0 0 18px rgba(80, 200, 255, 0.1);
  }

  #title {
    font-size: clamp(11px, 5vw, 15px);
    font-weight: 600;
    margin-bottom: 8px;

    color: #eaf7ff;

    text-shadow:
      0 0 6px rgba(100, 200, 255, 0.45);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  button {
    width: 32px;
    height: 30px;

    background: rgba(20, 40, 58, 0.55);

    border: 1px solid rgba(100, 200, 255, 0.4);
    border-radius: 6px;

    color: #dff5ff;
    font-size: 14px;

    cursor: pointer;

    transition:
      background 0.2s ease,
      box-shadow 0.2s ease,
      border-color 0.2s ease,
      transform 0.15s ease;
  }

  button:hover {
    background: rgba(50, 110, 150, 0.5);
    border-color: rgba(150, 225, 255, 0.9);

    box-shadow:
      0 0 8px rgba(70, 190, 255, 0.5),
      0 0 16px rgba(50, 160, 255, 0.25);

    transform: translateY(-1px);
  }

  button:active {
    transform: scale(0.94);
  }

  #volWrap {
    display: flex;
    align-items: center;
    gap: 5px;

    color: #bde7ff;
    font-size: 12px;
  }

  #volume {
    width: 70px;
    height: 4px;
    accent-color: #5cc7ff;
    cursor: pointer;
  }

  #progress {
    display: block;
    width: 100%;
    height: 5px;
    margin-top: 10px;

    accent-color: #5cc7ff;
    cursor: pointer;
  }

  #status {
    color: rgba(200, 230, 245, 0.65);
    font-size: 9px;
    margin-top: 4px;
  }
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

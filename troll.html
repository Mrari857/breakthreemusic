<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Player</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    color: #eaf7ff;
  }


  /* =================================
     PLAYER
     ================================= */

#player {
  position: relative;
  isolation: isolate;

  width: 100%;
  height: 100%;
  padding: 10px;

  border-radius: 16px;

  background: rgba(12, 22, 34, 0.68);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 1px solid rgba(100, 200, 255, 0.38);

  overflow: hidden;

  /* SOFT BLUE GLOW AROUND THE WHOLE BORDER */
  box-shadow:
    0 0 5px rgba(80, 190, 255, 0.45),
    0 0 12px rgba(60, 175, 245, 0.28),
    0 0 24px rgba(40, 150, 230, 0.16),
    inset 0 0 8px rgba(100, 210, 255, 0.06);

  transition: 0.25s ease;
}


/* MOVING GLOW AROUND THE BORDER */
#player::before {
  content: "";

  position: absolute;
  inset: -3px;

  border-radius: 19px;

  background: conic-gradient(
    from 0deg,

    transparent 0deg,
    transparent 260deg,

    rgba(40, 160, 255, 0.08) 285deg,
    rgba(60, 190, 255, 0.25) 315deg,
    rgba(130, 225, 255, 0.95) 340deg,
    rgba(190, 245, 255, 1) 350deg,
    rgba(70, 190, 255, 0.25) 360deg
  );

  filter: blur(3px);

  animation: orbit 3.5s linear infinite;

  pointer-events: none;

  z-index: -1;
}


/* SOFT FULL BORDER HALO */
#player::after {
  content: "";

  position: absolute;
  inset: 0;

  border-radius: 16px;

  box-shadow:
    0 0 8px rgba(70, 190, 255, 0.35),
    0 0 18px rgba(60, 175, 245, 0.18);

  pointer-events: none;

  z-index: -1;

  animation: glowPulse 2.2s ease-in-out infinite alternate;
}


@keyframes orbit {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}


@keyframes glowPulse {
  from {
    opacity: 0.55;
  }

  to {
    opacity: 1;
  }
}


/* HOVER */

#player:hover {
  border-color: rgba(130, 220, 255, 0.6);

  box-shadow:
    0 0 7px rgba(90, 205, 255, 0.6),
    0 0 16px rgba(60, 180, 250, 0.4),
    0 0 30px rgba(40, 150, 230, 0.22),
    inset 0 0 10px rgba(100, 210, 255, 0.08);

  transform: scale(1.01);
}


  /* =================================
     TITLE
     ================================= */

  #title {

    position: relative;

    z-index: 5;

    margin-bottom: 8px;

    font-size: clamp(11px, 5vw, 14px);

    font-weight: 600;

    color: #e9f7ff;

    text-shadow:
      0 0 5px
        rgba(100, 200, 245, 0.35);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
  }


  /* =================================
     CONTROLS
     ================================= */

  #controls {

    position: relative;

    z-index: 5;

    display: flex;

    align-items: center;

    gap: 7px;
  }


  /* =================================
     PLAY BUTTON
     ================================= */

  button {

    width: 32px;
    height: 30px;

    padding: 0;

    background:
      rgba(20, 38, 52, 0.55);

    border:
      1px solid
      rgba(100, 190, 230, 0.3);

    border-radius: 7px;

    color: #dff5ff;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
      inset 0 1px 0
        rgba(255, 255, 255, 0.04),

      0 0 5px
        rgba(60, 170, 220, 0.12);

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.15s ease;
  }


  button:hover {

    background:
      rgba(35, 65, 85, 0.65);

    border-color:
      rgba(140, 220, 250, 0.6);

    box-shadow:
      0 0 7px
        rgba(70, 190, 240, 0.3);

    transform:
      translateY(-1px);
  }


  button:active {
    transform: scale(0.93);
  }


  /* =================================
     VOLUME
     ================================= */

  #volWrap {

    display: flex;

    align-items: center;

    gap: 5px;

    color: #b9dff0;

    font-size: 12px;
  }


  #volume {

    width: 70px;

    height: 4px;

    accent-color: #5dbce8;

    cursor: pointer;
  }


  /* =================================
     PROGRESS
     ================================= */

  #progress {

    position: relative;

    z-index: 5;

    display: block;

    width: 100%;

    height: 5px;

    margin-top: 10px;

    accent-color: #5dbce8;

    cursor: pointer;
  }


  /* =================================
     STATUS
     ================================= */

  #status {

    position: relative;

    z-index: 5;

    margin-top: 4px;

    color:
      rgba(190, 220, 235, 0.6);

    font-size: 9px;
  }

</style>
</head>


<body>

<div id="player">

  <div id="title">
    PEEK MOOSIC
  </div>

  <div id="controls">

    <button id="playPause">
      ▶
    </button>

    <div id="volWrap">

      🔊

      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >

    </div>

  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    step="1"
  >

</div>


<audio
  id="audio"
  preload="metadata"
>
  <source
    src="https://raw.githubusercontent.com/Mrari857/breakthreemusic/main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
    type="audio/mpeg"
  >
</audio>


<script>

  const audio =
    document.getElementById("audio");

  const playPause =
    document.getElementById("playPause");

  const progress =
    document.getElementById("progress");

  const volume =
    document.getElementById("volume");


  audio.volume =
    Number(volume.value);


  /* PLAY / PAUSE */

  playPause.addEventListener(
    "click",
    async () => {

      try {

        if (audio.paused) {

          await audio.play();

          playPause.textContent = "⏸";

        } else {

          audio.pause();

          playPause.textContent = "▶";
        }

      } catch (error) {

        console.error(
          "Audio playback failed:",
          error
        );

        playPause.textContent = "▶";
      }

    }
  );


  /* VOLUME */

  volume.addEventListener(
    "input",
    () => {

      audio.volume =
        Number(volume.value);

    }
  );


  /* LOAD DURATION */

  audio.addEventListener(
    "loadedmetadata",
    () => {

      if (
        Number.isFinite(
          audio.duration
        )
      ) {

        progress.max =
          Math.floor(
            audio.duration
          );

      }

    }
  );


  /* PROGRESS */

  audio.addEventListener(
    "timeupdate",
    () => {

      if (
        Number.isFinite(
          audio.currentTime
        )
      ) {

        progress.value =
          Math.floor(
            audio.currentTime
          );

      }

    }
  );


  /* SEEK */

  progress.addEventListener(
    "input",
    () => {

      if (
        Number.isFinite(
          audio.duration
        )
      ) {

        audio.currentTime =
          Number(progress.value);

      }

    }
  );


  /* RESET BUTTON */

  audio.addEventListener(
    "ended",
    () => {

      playPause.textContent = "▶";

    }
  );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;

  background: transparent !important;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;

  font-family: system-ui, sans-serif;
  color: white;
}


/* =========================
   PLAYER
   ========================= */

#player {
  position: relative;

  width: 100%;
  height: 100%;

  padding: 10px;

  border-radius: 20px;

  background: transparent !important;

  border: 1px solid rgba(130, 220, 255, 0.45);

  overflow: hidden;

  box-shadow:
    0 0 6px rgba(70, 190, 255, 0.35);

  transition: transform 0.25s ease;
}


/* =========================
   MOVING BORDER LIGHT
   ========================= */

#player::before {
  content: "";

  position: absolute;

  inset: -2px;

  border-radius: 22px;

  padding: 2px;

  background: conic-gradient(
    from 0deg,

    transparent 0deg,
    transparent 300deg,

    rgba(50, 180, 255, 0.1) 320deg,
    rgba(80, 200, 255, 0.7) 338deg,
    #d5f7ff 350deg,
    rgba(80, 200, 255, 0.7) 357deg,

    transparent 360deg
  );

  /*
    Show only the border
  */
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  -webkit-mask-composite: xor;

  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  mask-composite: exclude;

  filter:
    drop-shadow(0 0 3px #5dccff)
    drop-shadow(0 0 8px rgba(60, 190, 255, 0.8));

  animation: borderRotate 2.8s linear infinite;

  pointer-events: none;
}


/* =========================
   SOFT BORDER GLOW
   ========================= */

#player::after {
  content: "";

  position: absolute;

  inset: 0;

  border-radius: 20px;

  border: 2px solid transparent;

  box-shadow:
    0 0 8px rgba(80, 200, 255, 0.35);

  pointer-events: none;

  animation: softGlow 2s ease-in-out infinite alternate;
}


@keyframes borderRotate {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}


@keyframes softGlow {
  from {
    opacity: 0.4;
  }

  to {
    opacity: 0.9;
  }
}


/* =========================
   HOVER
   ========================= */

#player:hover {
  transform: scale(1.01);

  border-color: rgba(180, 240, 255, 0.7);

  box-shadow:
    0 0 8px rgba(100, 210, 255, 0.6),
    0 0 18px rgba(60, 180, 255, 0.3);
}


/* =========================
   TITLE
   ========================= */

#title {
  position: relative;
  z-index: 5;

  margin-bottom: 8px;

  font-size: 14px;
  font-weight: 700;

  color: #f0fbff;

  text-shadow:
    0 0 5px rgba(100, 210, 255, 0.8);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* =========================
   CONTROLS
   ========================= */

#controls {
  position: relative;
  z-index: 5;

  display: flex;
  align-items: center;

  gap: 7px;
}


/* =========================
   BUTTON
   ========================= */

button {
  width: 32px;
  height: 30px;

  padding: 0;

  background: transparent;

  border: 1px solid rgba(120, 215, 255, 0.6);

  border-radius: 7px;

  color: #e9faff;

  font-size: 14px;

  cursor: pointer;

  box-shadow:
    0 0 5px rgba(70, 190, 255, 0.35);

  transition: 0.2s ease;
}


button:hover {
  border-color: #c9f5ff;

  box-shadow:
    0 0 7px #66d6ff,
    0 0 15px rgba(60, 180, 255, 0.6);

  transform: translateY(-1px);
}


button:active {
  transform: scale(0.92);
}


/* =========================
   VOLUME
   ========================= */

#volWrap {
  display: flex;
  align-items: center;

  gap: 5px;

  color: #c9efff;

  font-size: 12px;

  text-shadow:
    0 0 5px rgba(80, 200, 255, 0.7);
}


#volume {
  width: 70px;
  height: 4px;

  accent-color: #62cfff;

  cursor: pointer;
}


/* =========================
   PROGRESS
   ========================= */

#progress {
  position: relative;
  z-index: 5;

  width: 100%;
  height: 5px;

  margin-top: 10px;

  accent-color: #62cfff;

  cursor: pointer;
}


/* =========================
   STATUS
   ========================= */

#status {
  position: relative;
  z-index: 5;

  margin-top: 4px;

  color: rgba(210, 240, 250, 0.7);

  font-size: 9px;
}
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

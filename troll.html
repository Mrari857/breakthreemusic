<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eaf7ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Main player */
  #player {
    position: relative;

    width: 100%;
    height: 100%;

    padding: clamp(8px, 3%, 16px);

    border-radius: 10px;

    /* Transparent glass */
    background: rgba(8, 18, 30, 0.28);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    /* Light-blue glowing border */
    border: 1px solid rgba(120, 215, 255, 0.85);

    /* Blue ambient glow */
    box-shadow:
      0 0 5px rgba(100, 210, 255, 1),
      0 0 12px rgba(80, 200, 255, 0.9),
      0 0 25px rgba(50, 170, 255, 0.7),
      0 0 50px rgba(30, 140, 255, 0.4),
      inset 0 0 15px rgba(80, 200, 255, 0.12);

    transition:
      transform 0.25s ease,
      border-color 0.3s ease,
      box-shadow 0.3s ease,
      background 0.3s ease;

    animation: bluePulse 3s ease-in-out infinite;
  }

  /* Hover effect */
  #player:hover {
    transform: scale(1.015);

    background: rgba(8, 20, 35, 0.36);

    border-color: rgba(175, 235, 255, 1);

    box-shadow:
      0 0 6px rgba(150, 230, 255, 1),
      0 0 15px rgba(110, 220, 255, 1),
      0 0 30px rgba(70, 195, 255, 0.95),
      0 0 60px rgba(30, 155, 255, 0.7),
      0 0 100px rgba(20, 120, 255, 0.35),
      inset 0 0 20px rgba(100, 220, 255, 0.2);
  }

  /* Slow ambient glow */
  @keyframes bluePulse {
    0%,
    100% {
      box-shadow:
        0 0 5px rgba(100, 210, 255, 0.9),
        0 0 12px rgba(80, 200, 255, 0.75),
        0 0 25px rgba(50, 170, 255, 0.55),
        0 0 45px rgba(30, 140, 255, 0.3),
        inset 0 0 15px rgba(80, 200, 255, 0.1);
    }

    50% {
      box-shadow:
        0 0 8px rgba(130, 225, 255, 1),
        0 0 20px rgba(100, 215, 255, 0.95),
        0 0 40px rgba(60, 185, 255, 0.75),
        0 0 70px rgba(30, 145, 255, 0.45),
        inset 0 0 20px rgba(100, 220, 255, 0.16);
    }
  }

  /* Song title */
  #title {
    font-size: clamp(11px, 5vw, 15px);
    font-weight: 600;

    margin-bottom: 8px;

    color: #eaf7ff;

    text-shadow:
      0 0 5px rgba(120, 215, 255, 0.5),
      0 0 12px rgba(70, 180, 255, 0.25);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Controls */
  #controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Play button */
  button {
    width: 32px;
    height: 30px;

    padding: 0;

    background: rgba(20, 40, 58, 0.55);

    border: 1px solid rgba(110, 210, 255, 0.5);

    border-radius: 6px;

    color: #dff5ff;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
      0 0 6px rgba(70, 190, 255, 0.2),
      inset 0 1px rgba(255, 255, 255, 0.06);

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.15s ease;
  }

  /* Button hover */
  button:hover {
    background: rgba(50, 110, 150, 0.55);

    border-color: rgba(165, 230, 255, 0.95);

    color: white;

    box-shadow:
      0 0 8px rgba(80, 200, 255, 0.65),
      0 0 18px rgba(50, 170, 255, 0.35);

    transform: translateY(-1px);
  }

  /* Button click */
  button:active {
    transform: scale(0.93);
  }

  /* Volume area */
  #volWrap {
    display: flex;
    align-items: center;
    gap: 5px;

    color: #bde7ff;

    font-size: 12px;

    text-shadow:
      0 0 6px rgba(80, 190, 255, 0.35);
  }

  /* Volume slider */
  #volume {
    width: 70px;
    height: 4px;

    accent-color: #5cc7ff;

    cursor: pointer;
  }

  /* Progress slider */
  #progress {
    display: block;

    width: 100%;
    height: 5px;

    margin-top: 10px;

    accent-color: #5cc7ff;

    cursor: pointer;
  }

  /* Status text */
  #status {
    color: rgba(200, 230, 245, 0.65);

    font-size: 9px;

    margin-top: 4px;

    text-shadow:
      0 0 5px rgba(80, 190, 255, 0.2);
  }

  /* Make sliders glow when hovered */
  #volume:hover,
  #progress:hover {
    filter:
      drop-shadow(0 0 4px rgba(80, 200, 255, 0.8))
      drop-shadow(0 0 8px rgba(50, 170, 255, 0.4));
  }
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>

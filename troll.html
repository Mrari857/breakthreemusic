<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Player</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    width: 240px;
    height: 110px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #eef8ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #player {
    position: relative;
    width: 232px;
    padding: 10px;
    border-radius: 8px;

    /* glass */
    background: rgba(18, 27, 38, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    /* subtle border */
    border: 1px solid rgba(100, 190, 255, 0.25);

    /* blue ambient glow */
    box-shadow:
      0 0 8px rgba(40, 150, 255, 0.18),
      0 0 22px rgba(30, 120, 255, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  #title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;

    color: #eaf7ff;

    text-shadow:
      0 0 8px rgba(90, 190, 255, 0.35);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  button {
    width: 30px;
    height: 28px;
    padding: 0;

    background: rgba(35, 55, 72, 0.7);
    border: 1px solid rgba(100, 190, 255, 0.28);
    border-radius: 5px;

    color: #dff5ff;
    font-size: 13px;

    cursor: pointer;

    box-shadow:
      0 0 7px rgba(40, 160, 255, 0.12),
      inset 0 1px rgba(255, 255, 255, 0.06);

    transition: 0.15s ease;
  }

  button:hover {
    background: rgba(45, 80, 105, 0.85);
    border-color: rgba(100, 200, 255, 0.55);

    box-shadow:
      0 0 10px rgba(40, 170, 255, 0.3),
      0 0 20px rgba(40, 130, 255, 0.12);
  }

  #volWrap {
    display: flex;
    align-items: center;
    gap: 5px;

    color: #b8dfff;
    font-size: 12px;
  }

  #volume {
    width: 65px;
    height: 4px;
    accent-color: #4db8ff;
    cursor: pointer;
  }

  #progress {
    display: block;
    width: 100%;
    height: 5px;
    margin-top: 9px;

    accent-color: #4db8ff;
    cursor: pointer;
  }

  #status {
    color: rgba(200, 225, 240, 0.65);
    font-size: 9px;
    margin-top: 4px;
  }
</style>
</head>

<body>

<div id="player">

  <div id="title">Dominic Fike - Baby Doll</div>

  <div id="controls">
    <button id="playPause">▶</button>

    <div id="volWrap">
      🔊
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >
    </div>
  </div>

  <input
    type="range"
    id="progress"
    value="0"
    min="0"
    max="100"
    step="1"
  >

  <div id="status">Ready</div>

</div>

<audio id="audio" preload="metadata">
  <source
  src="https://cdn.jsdelivr.net/gh/Mrari857/breakthreemusic@main/Dominic_Fike_-_Baby_Doll_(mp3.pm).mp3"
  type="audio/mpeg"
>
</audio>

<script>
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

audio.volume = 0.7;

playPause.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      status.textContent = "Loading...";

      await audio.play();

      playPause.textContent = "⏸";
      status.textContent = "Playing";

    } catch (error) {

      console.error(error);
      status.textContent = "Audio failed to play";

    }

  } else {

    audio.pause();

    playPause.textContent = "▶";
    status.textContent = "Paused";

  }

});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("loadedmetadata", () => {

  if (isFinite(audio.duration)) {
    progress.max = Math.floor(audio.duration);
    status.textContent = "Ready";
  }

});

audio.addEventListener("timeupdate", () => {

  if (isFinite(audio.duration)) {
    progress.value = Math.floor(audio.currentTime);
  }

});

progress.addEventListener("input", () => {

  if (isFinite(audio.duration)) {
    audio.currentTime = Number(progress.value);
  }

});

audio.addEventListener("ended", () => {

  playPause.textContent = "▶";
  status.textContent = "Finished";
  progress.value = 0;

});

audio.addEventListener("error", () => {

  console.error("Audio error:", audio.error);

  status.textContent = "MP3 could not be loaded";

});

audio.addEventListener("canplay", () => {

  status.textContent = "Ready";

});
</script>

</body>
</html>
